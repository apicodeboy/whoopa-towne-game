<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0e12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Whoopa Towne - two crews, one town. A browser-based multiplayer third-person shooter." />
    <title>Whoopa Towne</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Boot loading screen. Inline so the artwork shows before any script has downloaded;
         client/src/ui/loadingScreen.ts drives the bar and removes it. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 50;
        overflow: hidden;
        background: #0d0e12;
        transition: opacity 0.6s ease;
      }
      #loading.ld-done {
        opacity: 0;
        pointer-events: none;
      }
      /* Fills the screen edge to edge (16:9 art, cropped like background-size: cover). It is
         pinned to the bottom so wide phones crop the top, never the loading bar; narrower
         screens (16:10, 4:3) lose a little of each side. */
      #loading .ld-art {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        container-type: inline-size;
        width: max(100vw, calc(100vh * 16 / 9));
        width: max(100vw, calc(100dvh * 16 / 9));
        aspect-ratio: 16 / 9;
      }
      #loading .ld-art img {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Portrait or ultra-wide: cropping would cut the title, so show the whole picture and
         fill the rest with a blurred, dimmed copy of it. */
      #loading .ld-backdrop {
        display: none;
        position: absolute;
        inset: -60px;
        background: url('/assets/ui/loading-screen-1920.jpg') center / cover no-repeat;
        filter: blur(28px) brightness(0.45);
      }
      @media (max-aspect-ratio: 1/1), (min-aspect-ratio: 12/5) {
        #loading .ld-backdrop {
          display: block;
        }
        #loading .ld-art {
          top: 50%;
          bottom: auto;
          transform: translate(-50%, -50%);
          width: min(100vw, calc(100vh * 16 / 9));
          width: min(100vw, calc(100dvh * 16 / 9));
        }
      }
      /* The live bar is drawn exactly over the bar painted into the art, hiding its painted
         fill: black ring at image px 1080,1948 → 2758,2041 of 3840x2160 (1cqw = 38.4 px), then
         a grey bevel and the track inside it. */
      #loading .ld-ring {
        position: absolute;
        left: 28.125%;
        top: 90.185%;
        width: 43.724%;
        height: 4.352%;
        padding: 0.3125cqw;
        border-radius: 999px;
        background: #030303;
      }
      #loading .ld-track {
        height: 100%;
        overflow: hidden;
        border-radius: 999px;
        background: #080707;
        box-shadow: inset 0 0 0 0.27cqw #8a8a8b;
      }
      #loading .ld-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(#fffc3a 0%, #fdfb2a 18%, #fdfc00 26%, #fef802 74%, #f1cc0b 86%, #c1a63e 100%);
      }
    </style>
  </head>
  <body>
    <!-- hand-inked outlines for the UI (see styles/theme.css): wobbles a border like a marker line -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="ink2" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="21" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="4.6" xChannelSelector="G" yChannelSelector="R" />
      </filter>
    </svg>
    <div id="app">
      <div id="viewport"></div>
      <div id="ui"></div>
      <div class="rotate-hint">ROTATE YOUR PHONE<small>Whoopa Towne plays in landscape.</small></div>
      <div id="loading" role="progressbar" aria-label="Loading Whoopa Towne" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="ld-backdrop"></div>
        <div class="ld-art">
          <img
            src="/assets/ui/loading-screen-1920.jpg"
            srcset="/assets/ui/loading-screen-1920.jpg 1920w, /assets/ui/loading-screen-2880.jpg 2880w, /assets/ui/loading-screen-3840.jpg 3840w"
            sizes="max(100vw, 177.78vh)"
            alt="Whoopa-Towne Online"
            width="3840"
            height="2160"
            fetchpriority="high"
          />
          <div class="ld-ring"><div class="ld-track"><div class="ld-fill"></div></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
