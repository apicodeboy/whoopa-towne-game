<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0e12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Whoopa Towne - two crews, one town. A browser-based multiplayer third-person shooter." />
    <title>Whoopa Towne</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Boot loading screen. Inline so the artwork shows before any script has downloaded;
         client/src/ui/loadingScreen.ts drives the bar and removes it. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #0d0e12;
        transition: opacity 0.6s ease;
      }
      #loading.ld-done {
        opacity: 0;
        pointer-events: none;
      }
      /* the same art, blurred and dimmed, fills the letterbox around it on any screen shape */
      #loading .ld-backdrop {
        position: absolute;
        inset: -60px;
        background: url('/assets/ui/loading-screen.jpg') center / cover no-repeat;
        filter: blur(28px) brightness(0.45);
      }
      #loading .ld-art {
        position: relative;
        container-type: inline-size;
        width: min(100vw, calc(100vh * 1672 / 941));
        width: min(100vw, calc(100dvh * 1672 / 941));
        aspect-ratio: 1672 / 941;
      }
      #loading .ld-art img {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* The live bar sits exactly over the bar painted into the art (image px 475,855 → 1195,883
         of 1672x941) and hides the painted fill. */
      #loading .ld-track {
        position: absolute;
        left: 28.409%;
        top: 90.861%;
        width: 43.062%;
        height: 2.976%;
        overflow: hidden;
        border-radius: 999px;
        background: #0a0908;
        box-shadow: inset 0 0 0 0.2cqw #808081;
      }
      #loading .ld-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(#fffbd0 0%, #fff35a 20%, #ffe800 48%, #fde500 82%, #fff36a 100%);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <div id="ui"></div>
      <div class="rotate-hint">ROTATE YOUR PHONE<small>Whoopa Towne plays in landscape.</small></div>
      <div id="loading" role="progressbar" aria-label="Loading Whoopa Towne" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="ld-backdrop"></div>
        <div class="ld-art">
          <img src="/assets/ui/loading-screen.jpg" alt="Whoopa-Towne Online" width="1672" height="941" fetchpriority="high" />
          <div class="ld-track"><div class="ld-fill"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
